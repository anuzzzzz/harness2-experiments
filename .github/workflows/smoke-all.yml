name: smoke-all
# One real base-harness rollout per experiment (5 rollouts, roughly $1-3 in total). Run this
# first: it proves API access, every benchmark runner, grading and cost accounting end to end.

on:
  workflow_dispatch:
    inputs:
      confirm_spend:
        description: I understand this uses the ANTHROPIC_API_KEY secret (about $1-3 in total)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        experiment: [e3-tau-airline, e2-tau-banking, e1-lab-lpa, e4-terminal-bench, e5-swe-pro]
    uses: ./.github/workflows/experiment.yml
    with:
      experiment: ${{ matrix.experiment }}
      phase: smoke
      confirm_spend: ${{ inputs.confirm_spend }}
    secrets: inherit
