name: ci
# Offline checks on every push: no secrets, no model calls, no spend.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plumbing:
    name: unit + end-to-end plumbing (fakes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          family: core
      - name: Unit tests and fake end-to-end runs (Harness2 for real, every model faked)
        run: python -m unittest discover -s tests -t . -v

  tau2-contract:
    name: tau2-bench API contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          family: tau
      - run: python -m unittest tests.test_contract_tau2 -v

  harbor-contract:
    name: Harbor API contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install (without fetching task directories)
        uses: ./.github/actions/setup
        with:
          family: harbor
      - run: python -m unittest tests.test_contract_harbor -v
