name: h2x setup
description: Python env with Harness2 + h2x, Claude Code CLI, and the benchmark family's dependencies.
inputs:
  family:
    description: "tau | harbor | lab | core"
    required: true
  experiment:
    description: experiment id (for task fetching / import)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Every step's output is also appended to $RUNNER_TEMP/h2x-setup.log; if any step fails, the
    # last step turns the log's tail into an error annotation on the run page.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements/*.txt
          pyproject.toml

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install Harness2 (pinned fork) and h2x
      shell: bash
      run: |
        {
          python -m pip install --upgrade pip
          pip install -r requirements/core.txt
          pip install -e ".[test]"
          harness2 --version
        } 2>&1 | tee -ia "$RUNNER_TEMP/h2x-setup.log"

    - name: Install Claude Code CLI (improver for every experiment, executor for LAB)
      shell: bash
      run: |
        {
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION:-latest}"
          claude --version | tee claude-code-version.txt
        } 2>&1 | tee -ia "$RUNNER_TEMP/h2x-setup.log"

    # ---- tau2-bench ---------------------------------------------------------------------------
    - name: Cache tau2-bench checkout
      if: inputs.family == 'tau'
      uses: actions/cache@v4
      with:
        path: vendor/tau2-bench
        key: tau2-bench-989d3285-v1
    - name: Install tau2-bench v2.0.0
      if: inputs.family == 'tau'
      shell: bash
      run: |
        {
          bash scripts/fetch_tau2.sh vendor/tau2-bench
          pip install -e "vendor/tau2-bench[knowledge]"
          python -c "import tau2, litellm; print('tau2 ok, litellm', getattr(litellm, '__version__', ''))"
        } 2>&1 | tee -ia "$RUNNER_TEMP/h2x-setup.log"

    # ---- Harbor ---------------------------------------------------------------------------------
    - name: Free disk space for task images
      if: inputs.family == 'harbor'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force || true
        df -h /
    - name: Install Harbor
      if: inputs.family == 'harbor'
      shell: bash
      run: |
        {
          pip install -r requirements/harbor.txt
          harbor --version || true
          docker version --format '{{.Server.Version}}'
        } 2>&1 | tee -ia "$RUNNER_TEMP/h2x-setup.log"
    - name: Cache Harbor task directories
      if: inputs.family == 'harbor' && inputs.experiment != ''
      uses: actions/cache@v4
      with:
        path: experiments/${{ inputs.experiment }}/.cache/tasks
        key: harbor-tasks-${{ inputs.experiment }}-${{ hashFiles(format('experiments/{0}/tasks.lock.json', inputs.experiment)) }}
    - name: Fetch pre-registered Harbor tasks
      if: inputs.family == 'harbor' && inputs.experiment != ''
      shell: bash
      run: h2x setup "${{ inputs.experiment }}" 2>&1 | tee -ia "$RUNNER_TEMP/h2x-setup.log"

    # ---- Harvey LAB -----------------------------------------------------------------------------
    - name: System tools for legal documents
      if: inputs.family == 'lab'
      shell: bash
      run: |
        {
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc poppler-utils >/dev/null
          pip install -r requirements/lab.txt
        } 2>&1 | tee -ia "$RUNNER_TEMP/h2x-setup.log"
    - name: Cache harvey-labs checkout
      if: inputs.family == 'lab'
      uses: actions/cache@v4
      with:
        path: vendor/harvey-labs
        key: harvey-labs-b58a28ae-v1
    - name: Fetch harvey-labs and import LAB tasks
      if: inputs.family == 'lab'
      shell: bash
      run: |
        {
          bash scripts/fetch_lab.sh vendor/harvey-labs
          echo "H2X_LAB_ROOT=$GITHUB_WORKSPACE/vendor/harvey-labs" >> "$GITHUB_ENV"
          H2X_LAB_ROOT="$GITHUB_WORKSPACE/vendor/harvey-labs" h2x setup "${{ inputs.experiment }}"
        } 2>&1 | tee -ia "$RUNNER_TEMP/h2x-setup.log"

    - name: Report a setup failure
      if: failure()
      shell: bash
      run: python3 scripts/gha.py annotate --title "setup (${{ inputs.family }})" --outcome failure "$RUNNER_TEMP/h2x-setup.log" || true
