id = "e2-tau-banking"
title = "τ³-bench banking_knowledge — customer service over a knowledge base"
question = "Does a harness that Harness² refines on 3 banking conversations raise Claude Haiku 5.5's pass rate on 24 held-out conversations, where answers depend on a 698-document knowledge base searched with BM25?"
suite = "h2x-tau"
domain = "banking_knowledge"
metric = "tau2 reward per conversation (1 = the database ends in the expected state, else 0)"

[models]
executor = "anthropic/claude-haiku-5-5"
user = "anthropic/claude-haiku-5-5"
improver = "anthropic/claude-sonnet-5-5"

[budget]
total_usd = 16.5
train_usd = 10.0
eval_usd = 6.0
smoke_usd = 0.4

[eval]
repeats = 2
shards = 4
concurrency = 4

[tau]
domain = "banking_knowledge"
retrieval_config = "bm25"          # offline retrieval; other configs need OpenAI/OpenRouter keys
max_steps = 200
max_errors = 10
timeout_s = 1200
communicate_scorer = "substring"
max_tokens = 16000
retries = 2
seed = 300

[estimate]
# per-unit guesses used only by `h2x plan`; the [budget] caps are what bind
rollout_usd = 0.06
improver_session_usd = 0.75
reflector_session_usd = 0.25
consolidation_usd = 1.0
