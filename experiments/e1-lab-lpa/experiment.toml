id = "e1-lab-lpa"
title = "Harvey LAB — drafting a fund LPA from a precedent"
question = "Does a Claude Code harness that Harness² refines on 3 LPA-drafting matters raise the share of rubric criteria Claude Haiku 5.5 meets on 6 held-out matters (different funds, documents and terms)?"
suite = "h2x-lab"
domain = "funds"
metric = "share of LAB rubric criteria met (LLM judge per criterion, LAB's own prompt and extraction)"

[models]
executor = "anthropic/claude-haiku-5-5"
improver = "anthropic/claude-sonnet-5-5"
judge = "claude-haiku-5-5"         # LAB's default judge is claude-sonnet-4-6; see README

[budget]
total_usd = 22.5
train_usd = 14.5
eval_usd = 7.0
smoke_usd = 1.0

[eval]
repeats = 1
shards = 3
concurrency = 2

[lab]
domain = "funds"
timeout_s = 2400

[estimate]
# per-unit guesses used only by `h2x plan`; the [budget] caps are what bind
rollout_usd = 0.45
judge_usd = 0.12
improver_session_usd = 0.75
reflector_session_usd = 0.25
consolidation_usd = 1.0
