# Harness² settings for e5-swe-pro (pinned fork 3ae3ae/harness2-cli@0c81134).
[suite]
name = "h2x-harbor"
work = ""

[paths]
harness = "harness"

[executor]
name = "claude"
model = "anthropic/claude-haiku-5-5"
timeout = 9000

[improver]
channel = "claude"
model = "anthropic/claude-sonnet-5-5"
# --max-budget-usd caps a single runaway session; the run-level cap is --budget-usd (h2x train).
bin = "claude --max-budget-usd 3"
effort = "high"
timeout = 3600

[reflector]
effort = "medium"

[run]
k = 1
modes = "parallel"
workers = 1
phase_width = 2
proposer_concurrency = 2
obs_trunc = 12000
